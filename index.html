<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rugby Notification Test</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <h1>Rugby Notification Test</h1>
  <p>This is a separate test page. The main Rugby Today page is not changed.</p>
  <button id="enable" type="button">Enable Notifications</button>
  <p id="status" role="status" aria-live="polite">Waiting...</p>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "89e4d4d9-37c6-49dc-9244-8f58dcc386cf",
        serviceWorkerPath: "test/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/RUGBY/test/" }
      });

      document.getElementById("status").textContent =
        "Permission: " + OneSignal.Notifications.permission;

      document.getElementById("enable").addEventListener("click", async () => {
        try {
          await OneSignal.Notifications.requestPermission();
          if (OneSignal.Notifications.permission) {
            await OneSignal.User.PushSubscription.optIn();
            document.getElementById("status").textContent =
              "Notifications enabled and subscription opted in.";
            alert("Notifications enabled.");
          } else {
            document.getElementById("status").textContent =
              "Permission was not granted.";
          }
        } catch (e) {
          document.getElementById("status").textContent = "ERROR: " + e;
          alert("ERROR: " + e);
        }
      });
    });
  </script>
</body>
</html>
